name: Build APK

on:
  push:
    branches: [ main, 'arena/**' ]
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Assemble release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK check
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ls "$SDK" || true
          ls "$SDK/platforms" || true
          yes 2>/dev/null | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || \
            yes 2>/dev/null | "$SDK/tools/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - name: Generate signing keystore
        id: keystore
        run: |
          set -euo pipefail
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using keystore from repository secrets."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "LUMIRA_KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}"
              echo "LUMIRA_KEY_ALIAS=${{ secrets.KEY_ALIAS }}"
              echo "LUMIRA_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"
            } >> "$GITHUB_ENV"
          else
            echo "No signing secrets found - generating an ephemeral keystore."
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/release.jks" \
              -storetype JKS \
              -alias lumira \
              -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass lumira-ci -keypass lumira-ci \
              -dname "CN=Lumira, OU=CI, O=Lumira, L=NA, S=NA, C=NA"
            {
              echo "LUMIRA_KEYSTORE_PASSWORD=lumira-ci"
              echo "LUMIRA_KEY_ALIAS=lumira"
              echo "LUMIRA_KEY_PASSWORD=lumira-ci"
            } >> "$GITHUB_ENV"
          fi
          echo "LUMIRA_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "store=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Build release APKs
        id: build
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log

      - name: Collect APKs
        id: apks
        if: always()
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/ 2>/dev/null || true
          ls -l dist || true
          if [ -n "$(ls -A dist 2>/dev/null)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report APK sizes and warnings
        if: always()
        run: |
          set +e
          {
            echo "### Build summary (${{ github.sha }})"
            echo
            echo '#### APK sizes'
            echo '```'
            ls -lh dist 2>/dev/null || echo "no APKs"
            echo '```'
            echo '#### Kotlin warnings'
            echo '```'
            grep -E "^w: " build.log | sed -E 's#file:///[^ ]*/app/src#…/app/src#' | sort -u | head -80
            echo '```'
            echo '#### Tail'
            echo '```'
            tail -c 2500 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_attempt }}
          path: build.log
          retention-days: 14
          if-no-files-found: warn

      - name: Upload APK artifacts
        if: always() && steps.apks.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lumira-apk-${{ github.run_number }}
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error

      # Artefact logs are not reachable from every environment, so a failing build
      # publishes the tail of build.log into the "ci-log" issue for quick triage.
      - name: Publish failure tail to ci-log issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          ISSUE=$(gh issue list --label ci-log --state open --json number --jq '.[0].number')
          if [ -z "$ISSUE" ]; then
            gh issue create --title "CI log" --label ci-log \
              --body "Rolling log of failing builds. Machine generated." > /dev/null
            sleep 3
            ISSUE=$(gh issue list --label ci-log --state open --json number --jq '.[0].number')
          fi
          {
            echo "### Failed run [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo
            echo "Commit: \`${{ github.sha }}\`"
            echo
            echo '#### What went wrong'
            echo '```'
            grep -E "What went wrong" -A 40 build.log 2>/dev/null | tail -60 || true
            echo '```'
            echo '#### Errors'
            echo '```'
            grep -E "^e: |^error:|^Caused by|^> Task .* FAILED|Could not (resolve|find|GET|download)|Script compilation errors|^[[:space:]]*e: file" \
              build.log 2>/dev/null | head -80 || true
            echo '```'
            echo '#### Tail'
            echo '```'
            tail -c 6000 build.log 2>/dev/null || echo "build.log missing"
            echo '```'
          } > /tmp/comment.md
          gh issue comment "$ISSUE" --body-file /tmp/comment.md

      - name: Publish build summary to ci-log issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          SIZES=$(ls -lh dist 2>/dev/null | tail -n +2 | awk '{print $9": "$5}' | paste -sd' | ')
          WARNINGS=$(grep -cE "^w: " build.log 2>/dev/null || echo 0)
          {
            echo "### OK run [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo
            echo "- commit: \`${{ github.sha }}\`"
            echo "- APKs: $SIZES"
            echo "- kotlin warnings: $WARNINGS"
            echo
            echo '```'
            grep -E "^w: " build.log | sed -E 's#file:///[^ ]*/app/src#…/app/src#' | sort -u | head -40
            echo '```'
          } > /tmp/ok.md
          gh issue comment 1 --body-file /tmp/ok.md

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v') && steps.apks.outputs.found == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Lumira ${{ github.ref_name }}
          files: dist/*.apk
          generate_release_notes: true
          body: |
            ## Lumira ${{ github.ref_name }}

            Wallpapers estáticos y animados, con biblioteca propia y tienda curada.

            Descarga el APK `arm64-v8a` para casi cualquier teléfono moderno.
            También se incluyen `armeabi-v7a` (dispositivos antiguos) y `x86_64` (emuladores).
