name: CI Diagnostics

# Small helper workflow: on demand, or right after a failed build, it copies the
# tail of the build log into the body of the "CI log" issue (#1). Sandboxes and
# other tooling that cannot read Actions artefacts can then read the real error.

on:
  workflow_run:
    workflows: [ "Build APK" ]
    types: [ completed ]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id to inspect (optional)"
        required: false

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  report:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Report failure log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: |
          set -uo pipefail
          echo "Inspecting run $RUN_ID"
          gh run view "$RUN_ID" --repo "$REPO" > /tmp/summary.txt 2>&1 || true
          gh run view "$RUN_ID" --repo "$REPO" --log > /tmp/full.log 2>&1 || true

          {
            echo "### Run $RUN_ID report"
            echo
            echo '#### Steps'
            echo '```'
            head -c 4000 /tmp/summary.txt
            echo '```'
            echo '#### Errors'
            echo '```'
            grep -nE "^\S+ (BUILD|FAILURE|e: |error:)|e: file|error:|Caused by|Execution failed|What went wrong|> Task .* FAILED|Could not (resolve|find|GET|download)" \
              /tmp/full.log | tail -120 || true
            echo '```'
            echo '#### Tail'
            echo '```'
            tail -c 12000 /tmp/full.log
            echo '```'
          } > /tmp/body.md

          gh issue edit 1 --repo "$REPO" --body-file /tmp/body.md
